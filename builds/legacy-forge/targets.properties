generation=legacy-forge
targets=1.20.1-forge
vcsTarget=1.20.1-forge
defaults.java.version=17

# Build isolation: Forge has its own Loom/Gradle build, while gameplay sources
# still come from the same legacy family as the 1.20.1 Fabric reference.
target.1.20.1-forge.source.family=legacy
target.1.20.1-forge.source.root=source-families/legacy
target.1.20.1-forge.source.family_platform_root=source-family-platforms/legacy/forge

target.1.20.1-forge.deps.yarn=1.20.1+build.10
target.1.20.1-forge.deps.forge=47.4.10
target.1.20.1-forge.deps.jei=15.20.0.123
target.1.20.1-forge.metadata.loader_min=[47,)
target.1.20.1-forge.metadata.minecraft=[1.20.1,1.20.2)
target.1.20.1-forge.metadata.forge_min=[47.4.10,)
target.1.20.1-forge.metadata.jei_min=[15.20,)

# JEI 1.20.1 Forge is not loaded into the Yarn-mapped Loom dev runtime.
# Its Forge jar calls Mojmap I18n names that are not reliably remapped in this
# environment. The API remains compile-only and the built Scythe Mod jar keeps
# normal optional JEI integration for production Forge instances.
target.1.20.1-forge.runtime.jei=false
