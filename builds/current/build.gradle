plugins {
    id 'base'
    id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

def repositoryRoot = rootProject.file('../..').canonicalFile
def commonConfigFile = new File(repositoryRoot, 'build-config/common.properties')
def targetConfigFile = rootProject.file('targets.properties')

if (!commonConfigFile.isFile() || !targetConfigFile.isFile()) {
    throw new GradleException('Missing Scythe Mod multiversion configuration')
}

def commonConfig = new Properties()
commonConfigFile.withInputStream { commonConfig.load(it) }
def targetConfig = new Properties()
targetConfigFile.withInputStream { targetConfig.load(it) }

def configuredTargets = targetConfig.getProperty('targets', '')
        .split(',').collect { it.trim() }.findAll { !it.isEmpty() }
if (configuredTargets.isEmpty()) {
    throw new GradleException('Current family has no configured targets')
}

def vcsTarget = targetConfig.getProperty('vcsTarget', '').trim()
if (!configuredTargets.contains(vcsTarget)) {
    throw new GradleException("vcsTarget '${vcsTarget}' is not in configured targets ${configuredTargets}")
}

def valueFor = { String targetName, String key ->
    def targetValue = targetConfig.getProperty("target.${targetName}.${key}")
    if (targetValue != null && !targetValue.trim().isEmpty()) return targetValue.trim()
    def commonValue = commonConfig.getProperty("common.${key}")
    if (commonValue != null && !commonValue.trim().isEmpty()) return commonValue.trim()
    return null
}
def requiredFor = { String targetName, String key ->
    def result = valueFor(targetName, key)
    if (result == null) throw new GradleException("Missing '${key}' for ${targetName}")
    result
}

subprojects {
    def targetName = name
    if (!configuredTargets.contains(targetName)) {
        throw new GradleException("Unexpected current target subproject '${targetName}'")
    }

    apply plugin: 'net.fabricmc.fabric-loom'
    apply plugin: 'maven-publish'

    def minecraftVersion = requiredFor(targetName, 'deps.minecraft')
    def loaderVersion = requiredFor(targetName, 'deps.loader')
    def fabricApiVersion = requiredFor(targetName, 'deps.fabric_api')
    def jeiVersion = requiredFor(targetName, 'deps.jei')
    def javaVersion = Integer.parseInt(requiredFor(targetName, 'java.version'))
    def modVersion = requiredFor(targetName, 'mod.version')
    def archiveName = requiredFor(targetName, 'mod.archive_name')

    def sharedSourceRoot = new File(repositoryRoot, requiredFor(targetName, 'source.shared_root'))
    def familySourceRoot = new File(repositoryRoot, requiredFor(targetName, 'source.root'))
    def platformSourceRoot = new File(repositoryRoot, requiredFor(targetName, 'source.platform_root'))
    def targetOverlayRoot = new File(repositoryRoot, requiredFor(targetName, 'source.overlay_root'))
    def sourceLayers = [sharedSourceRoot, familySourceRoot, platformSourceRoot, targetOverlayRoot]
    sourceLayers.each { layer ->
        if (!layer.isDirectory()) throw new GradleException("Configured source layer does not exist: ${layer}")
    }

    version = "${modVersion}+${minecraftVersion}"
    group = requiredFor(targetName, 'mod.group')
    base {
        archivesName = archiveName
    }

    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Modrinth'
                    url = 'https://api.modrinth.com/maven'
                }
            }
            filter {
                includeGroup 'maven.modrinth'
            }
        }
    }

    fabricApi {
        configureDataGeneration {
            client = true
        }
    }

    dependencies {
        minecraft "com.mojang:minecraft:${minecraftVersion}"
        implementation "net.fabricmc:fabric-loader:${loaderVersion}"
        implementation "net.fabricmc.fabric-api:fabric-api:${fabricApiVersion}"

        compileOnly "maven.modrinth:jei:${jeiVersion}"
        runtimeOnly "maven.modrinth:jei:${jeiVersion}"
    }

    def effectiveSourceDir = layout.buildDirectory.dir("effective-source/${targetName}")
    def effectiveSourceDirFile = effectiveSourceDir.get().asFile
    def sourceLayoutScript = new File(repositoryRoot, 'scripts/source_layout.py')
    def pythonExecutable = System.getenv('PYTHON') ?: (System.getProperty('os.name').toLowerCase().contains('win') ? 'python' : 'python3')

    def prepareEffectiveSource = tasks.register('prepareEffectiveSource', Exec) {
        group = 'build setup'
        description = "Materialize shared + current + Fabric + ${targetName} sources"
        inputs.file(commonConfigFile)
        inputs.file(targetConfigFile)
        inputs.file(sourceLayoutScript)
        sourceLayers.each { inputs.dir(it) }
        outputs.dir(effectiveSourceDir)

        doFirst {
            def out = effectiveSourceDir.get().asFile
            out.parentFile.mkdirs()
            commandLine pythonExecutable,
                    sourceLayoutScript.absolutePath,
                    targetName,
                    '--config', targetConfigFile.absolutePath,
                    '--output', out.absolutePath
        }
    }

    sourceSets {
        main {
            java.setSrcDirs([new File(effectiveSourceDirFile, 'src/main/java')])
            resources.setSrcDirs([new File(effectiveSourceDirFile, 'src/main/resources')])
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(javaVersion)
        }
        withSourcesJar()
    }

    processResources {
        dependsOn prepareEffectiveSource
        inputs.property 'version', project.version
        filesMatching('fabric.mod.json') {
            expand 'version': project.version
        }
    }

    tasks.named('compileJava') {
        dependsOn prepareEffectiveSource
    }
    tasks.named('sourcesJar') {
        dependsOn prepareEffectiveSource
    }
    tasks.matching { it.name == 'runClient' || it.name == 'runServer' || it.name == 'runDatagen' }.configureEach {
        dependsOn prepareEffectiveSource
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = javaVersion
        options.encoding = 'UTF-8'
    }

    jar {
        inputs.property 'archivesName', project.base.archivesName
        from(new File(repositoryRoot, 'LICENSE')) {
            rename { "${it}_${inputs.properties.archivesName}" }
        }
    }

    tasks.register('materializeSource') {
        group = 'build setup'
        description = "Materialize the effective source tree for ${targetName}"
        dependsOn prepareEffectiveSource
    }

    tasks.register('buildAndCollect') {
        group = 'build'
        description = "Build ${targetName} and collect the release jar in repository build/release"
        dependsOn 'build'
        doLast {
            def releaseDir = new File(repositoryRoot, 'build/release')
            releaseDir.mkdirs()
            copy {
                from tasks.named('remapJar').get().archiveFile.get().asFile
                into releaseDir
            }
            println "Collected ${targetName} -> ${releaseDir}"
        }
    }

    publishing {
        publications {
            create('mavenJava', MavenPublication) {
                artifactId = archiveName
                from components.java
            }
        }
    }

    println "Scythe Mod target: ${targetName}; Minecraft ${minecraftVersion}; Fabric ${loaderVersion}; Java ${javaVersion}"
}

// Family-level convenience tasks aggregate every current target.
tasks.named('build') {
    dependsOn configuredTargets.collect { ":${it}:build" }
}
tasks.named('clean') {
    dependsOn configuredTargets.collect { ":${it}:clean" }
}

tasks.register('buildAndCollect') {
    group = 'build'
    description = 'Build and collect every current Scythe Mod target'
    dependsOn configuredTargets.collect { ":${it}:buildAndCollect" }
}

tasks.register('runActiveClient') {
    group = 'fabric'
    description = "Run the configured VCS target (${vcsTarget})"
    dependsOn ":${vcsTarget}:runClient"
}

tasks.register('runActiveServer') {
    group = 'fabric'
    description = "Run the configured VCS target (${vcsTarget}) server"
    dependsOn ":${vcsTarget}:runServer"
}
