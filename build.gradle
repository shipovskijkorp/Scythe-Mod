plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // JEI's official Maven (maven.blamejared.com) can time out from some networks.
    // Modrinth Maven hosts the Fabric mod jar and is enough for optional JEI compatibility.
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // Optional JEI integration. JEI is used only for compiling the optional plugin and dev runtime;
    // users still do not need JEI to launch the mod. The version filter forces Fabric 1.20.1.
    modCompileOnly "maven.modrinth:jei:${project.jei_version}-fabric,${project.minecraft_version}"
    modRuntimeOnly "maven.modrinth:jei:${project.jei_version}-fabric,${project.minecraft_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }
}

java {
    // ✅ ключевое: компилируем мод под Java 17,
    // даже если Gradle/loom крутятся на Java 21
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }

    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    // ✅ страховка: байткод точно 17
    options.release = 17
    options.encoding = "UTF-8"
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
        // добавишь при необходимости
    }
}
