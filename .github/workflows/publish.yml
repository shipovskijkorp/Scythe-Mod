name: publish

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      build-matrix: ${{ steps.matrix.outputs.build }}
      publish-matrix: ${{ steps.matrix.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: microsoft
      - name: Resolve build and publication matrices
        id: matrix
        shell: bash
        run: |
          echo "build=$(python scripts/source_layout.py --ci-matrix)" >> "$GITHUB_OUTPUT"
          echo "publish=$(python scripts/source_layout.py --publish-matrix)" >> "$GITHUB_OUTPUT"
      - name: Validate release tag
        shell: bash
        run: |
          expected="$(sed -n 's/^common.mod.version=//p' build-config/common.properties)"
          actual="${{ github.event.release.tag_name }}"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Release tag '$actual' does not match common.mod.version '$expected'."
            exit 1
          fi
      - name: Validate publishing secrets
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          missing=0
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "::error::Missing repository Actions secret MODRINTH_TOKEN."
            missing=1
          fi
          if [ -z "$CURSEFORGE_TOKEN" ]; then
            echo "::error::Missing repository Actions secret CURSEFORGE_TOKEN."
            missing=1
          fi
          exit "$missing"
      - name: Validate sources and publishing metadata
        run: |
          python scripts/validate_source_layout.py --report
          python scripts/test_source_layout.py
          python scripts/verify_java.py

  build:
    needs: metadata
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.metadata.outputs.build-matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: microsoft
      - name: Build and collect family
        working-directory: builds/${{ matrix.family }}
        run: sh ./gradlew --no-daemon buildAndCollect
      - name: Capture release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scythe-release-${{ matrix.family }}
          path: build/release/*.jar
          if-no-files-found: error

  publish:
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJson(needs.metadata.outputs.publish-matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Download target family artifacts
        uses: actions/download-artifact@v4
        with:
          name: scythe-release-${{ matrix.generation }}
          path: release
      - name: Publish ${{ matrix.target }}
        uses: Kira-NT/mc-publish@v3
        with:
          files: release/${{ matrix.artifact }}

          name: ${{ matrix.version }}
          version: ${{ matrix.version }}
          version-type: release
          loaders: ${{ matrix.loaders }}
          game-versions: ${{ matrix.minecraft }}
          game-version-filter: none
          environment: client | server
          dependencies: ${{ matrix.dependencies }}

          modrinth-id: ${{ matrix.modrinth_id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-changelog: ${{ matrix.modrinth_changelog && github.event.release.body || '' }}

          curseforge-id: ${{ matrix.curseforge_id }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-changelog: ${{ github.event.release.body }}

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.event.release.tag_name }}
          github-changelog: ''
