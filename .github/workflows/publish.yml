name: publish

on:
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      build_matrix: ${{ steps.matrix.outputs.build }}
      modrinth_id: ${{ steps.publish_meta.outputs.modrinth_id }}
      curseforge_id: ${{ steps.publish_meta.outputs.curseforge_id }}
      fabric_dependencies: ${{ steps.publish_meta.outputs.fabric_dependencies }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: microsoft
      - name: Resolve build matrix
        id: matrix
        shell: bash
        run: echo "build=$(python scripts/source_layout.py --ci-matrix)" >> "$GITHUB_OUTPUT"
      - name: Resolve loader-specific publication metadata
        id: publish_meta
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import source_layout as sl
          props = sl.load_properties()
          fabric = next(
              row for row in sl.publish_matrix(props)["include"]
              if row["loader"] == "fabric"
          )
          print("modrinth_id=" + fabric["modrinth_id"])
          print("curseforge_id=" + fabric["curseforge_id"])
          print("fabric_dependencies=" + fabric["dependencies"])
          PY
      - name: Validate release tag
        shell: bash
        run: |
          expected="$(sed -n 's/^common.mod.version=//p' build-config/common.properties)"
          actual="${{ github.event.release.tag_name }}"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Release tag '$actual' does not match common.mod.version '$expected'."
            exit 1
          fi
      - name: Validate publishing secrets
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          missing=0
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "::error::Missing repository Actions secret MODRINTH_TOKEN."
            missing=1
          fi
          if [ -z "$CURSEFORGE_TOKEN" ]; then
            echo "::error::Missing repository Actions secret CURSEFORGE_TOKEN."
            missing=1
          fi
          exit "$missing"
      - name: Validate sources and publishing metadata
        run: |
          python scripts/validate_source_layout.py --report
          python scripts/test_source_layout.py
          python scripts/verify_java.py

  build:
    needs: metadata
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.metadata.outputs.build_matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: microsoft
      - name: Build and collect family
        working-directory: builds/${{ matrix.family }}
        run: sh ./gradlew --no-daemon buildAndCollect
      - name: Capture release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scythe-release-${{ matrix.family }}
          path: build/release/*.jar
          if-no-files-found: error

  publish_fabric:
    name: Publish Fabric and Quilt targets
    needs: [metadata, build]
    runs-on: ubuntu-24.04
    steps:
      - name: Download legacy Fabric artifacts
        uses: actions/download-artifact@v4
        with:
          name: scythe-release-legacy
          path: release/legacy
      - name: Download modern Fabric artifacts
        uses: actions/download-artifact@v4
        with:
          name: scythe-release-modern
          path: release/modern
      - name: Download current Fabric artifacts
        uses: actions/download-artifact@v4
        with:
          name: scythe-release-current
          path: release/current

      - name: Publish 1.20.1 Fabric and Quilt
        uses: Kira-NT/mc-publish@v3
        with:
          files: release/legacy/scythe-mod-fabric-${{ github.event.release.tag_name }}+1.20.1.jar
          name: ${{ github.event.release.tag_name }}+1.20.1
          version: ${{ github.event.release.tag_name }}+1.20.1
          version-type: release
          loaders: |
            fabric
            quilt
          game-versions: 1.20.1
          game-version-filter: none
          environment: client | server
          dependencies: ${{ needs.metadata.outputs.fabric_dependencies }}

          modrinth-id: ${{ needs.metadata.outputs.modrinth_id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-changelog: ${{ github.event.release.body }}

          curseforge-id: ${{ needs.metadata.outputs.curseforge_id }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-changelog: ${{ github.event.release.body }}

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.event.release.tag_name }}
          github-changelog: ''

      - name: Publish 1.21.1 Fabric and Quilt
        uses: Kira-NT/mc-publish@v3
        with:
          files: release/modern/scythe-mod-fabric-${{ github.event.release.tag_name }}+1.21.1.jar
          name: ${{ github.event.release.tag_name }}+1.21.1
          version: ${{ github.event.release.tag_name }}+1.21.1
          version-type: release
          loaders: |
            fabric
            quilt
          game-versions: 1.21.1
          game-version-filter: none
          environment: client | server
          dependencies: ${{ needs.metadata.outputs.fabric_dependencies }}

          modrinth-id: ${{ needs.metadata.outputs.modrinth_id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-changelog: ''

          curseforge-id: ${{ needs.metadata.outputs.curseforge_id }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-changelog: ${{ github.event.release.body }}

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.event.release.tag_name }}
          github-changelog: ''

      - name: Publish 1.21.11 Fabric and Quilt
        uses: Kira-NT/mc-publish@v3
        with:
          files: release/modern/scythe-mod-fabric-${{ github.event.release.tag_name }}+1.21.11.jar
          name: ${{ github.event.release.tag_name }}+1.21.11
          version: ${{ github.event.release.tag_name }}+1.21.11
          version-type: release
          loaders: |
            fabric
            quilt
          game-versions: 1.21.11
          game-version-filter: none
          environment: client | server
          dependencies: ${{ needs.metadata.outputs.fabric_dependencies }}

          modrinth-id: ${{ needs.metadata.outputs.modrinth_id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-changelog: ''

          curseforge-id: ${{ needs.metadata.outputs.curseforge_id }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-changelog: ${{ github.event.release.body }}

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.event.release.tag_name }}
          github-changelog: ''

      - name: Publish 26.1.2 Fabric and Quilt
        uses: Kira-NT/mc-publish@v3
        with:
          files: release/current/scythe-mod-fabric-${{ github.event.release.tag_name }}+26.1.2.jar
          name: ${{ github.event.release.tag_name }}+26.1.2
          version: ${{ github.event.release.tag_name }}+26.1.2
          version-type: release
          loaders: |
            fabric
            quilt
          game-versions: 26.1.2
          game-version-filter: none
          environment: client | server
          dependencies: ${{ needs.metadata.outputs.fabric_dependencies }}

          modrinth-id: ${{ needs.metadata.outputs.modrinth_id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-changelog: ''

          curseforge-id: ${{ needs.metadata.outputs.curseforge_id }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-changelog: ${{ github.event.release.body }}

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.event.release.tag_name }}
          github-changelog: ''

      - name: Publish 26.2 Fabric and Quilt
        uses: Kira-NT/mc-publish@v3
        with:
          files: release/current/scythe-mod-fabric-${{ github.event.release.tag_name }}+26.2.jar
          name: ${{ github.event.release.tag_name }}+26.2
          version: ${{ github.event.release.tag_name }}+26.2
          version-type: release
          loaders: |
            fabric
            quilt
          game-versions: 26.2
          game-version-filter: none
          environment: client | server
          dependencies: ${{ needs.metadata.outputs.fabric_dependencies }}

          modrinth-id: ${{ needs.metadata.outputs.modrinth_id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-changelog: ''

          curseforge-id: ${{ needs.metadata.outputs.curseforge_id }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-changelog: ${{ github.event.release.body }}

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.event.release.tag_name }}
          github-changelog: ''

      - name: Publish 26.3 Fabric and Quilt
        uses: Kira-NT/mc-publish@v3
        with:
          files: release/current/scythe-mod-fabric-${{ github.event.release.tag_name }}+26.3.jar
          name: ${{ github.event.release.tag_name }}+26.3
          version: ${{ github.event.release.tag_name }}+26.3
          version-type: release
          loaders: |
            fabric
            quilt
          game-versions: 26.3
          game-version-filter: none
          environment: client | server
          dependencies: ${{ needs.metadata.outputs.fabric_dependencies }}

          modrinth-id: ${{ needs.metadata.outputs.modrinth_id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-changelog: ''

          curseforge-id: ${{ needs.metadata.outputs.curseforge_id }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-changelog: ${{ github.event.release.body }}

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.event.release.tag_name }}
          github-changelog: ''

  wait_after_fabric:
    name: Wait for CurseForge Fabric processing
    needs: publish_fabric
    runs-on: ubuntu-24.04
    steps:
      - name: Wait 5 minutes before publishing other loaders
        run: sleep 300

  publish_forge:
    name: Publish Forge targets
    needs: [metadata, wait_after_fabric]
    runs-on: ubuntu-24.04
    steps:
      - name: Download Forge artifacts
        uses: actions/download-artifact@v4
        with:
          name: scythe-release-legacy-forge
          path: release/legacy-forge

      - name: Publish 1.20.1 Forge
        uses: Kira-NT/mc-publish@v3
        with:
          files: release/legacy-forge/scythe-mod-forge-${{ github.event.release.tag_name }}+1.20.1.jar
          name: ${{ github.event.release.tag_name }}+1.20.1
          version: ${{ github.event.release.tag_name }}+1.20.1
          version-type: release
          loaders: forge
          game-versions: 1.20.1
          game-version-filter: none
          environment: client | server

          modrinth-id: ${{ needs.metadata.outputs.modrinth_id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-changelog: ''

          curseforge-id: ${{ needs.metadata.outputs.curseforge_id }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-changelog: ${{ github.event.release.body }}

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.event.release.tag_name }}
          github-changelog: ''

  publish_neoforge:
    name: Publish NeoForge targets
    needs: [metadata, publish_forge]
    runs-on: ubuntu-24.04
    steps:
      - name: Download modern NeoForge artifacts
        uses: actions/download-artifact@v4
        with:
          name: scythe-release-modern-neoforge
          path: release/modern-neoforge
      - name: Download current NeoForge artifacts
        uses: actions/download-artifact@v4
        with:
          name: scythe-release-current-neoforge
          path: release/current-neoforge

      - name: Publish 1.21.1 NeoForge
        uses: Kira-NT/mc-publish@v3
        with:
          files: release/modern-neoforge/scythe-mod-neoforge-${{ github.event.release.tag_name }}+1.21.1.jar
          name: ${{ github.event.release.tag_name }}+1.21.1
          version: ${{ github.event.release.tag_name }}+1.21.1
          version-type: release
          loaders: neoforge
          game-versions: 1.21.1
          game-version-filter: none
          environment: client | server

          modrinth-id: ${{ needs.metadata.outputs.modrinth_id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-changelog: ''

          curseforge-id: ${{ needs.metadata.outputs.curseforge_id }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-changelog: ${{ github.event.release.body }}

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.event.release.tag_name }}
          github-changelog: ''

      - name: Publish 1.21.11 NeoForge
        uses: Kira-NT/mc-publish@v3
        with:
          files: release/modern-neoforge/scythe-mod-neoforge-${{ github.event.release.tag_name }}+1.21.11.jar
          name: ${{ github.event.release.tag_name }}+1.21.11
          version: ${{ github.event.release.tag_name }}+1.21.11
          version-type: release
          loaders: neoforge
          game-versions: 1.21.11
          game-version-filter: none
          environment: client | server

          modrinth-id: ${{ needs.metadata.outputs.modrinth_id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-changelog: ''

          curseforge-id: ${{ needs.metadata.outputs.curseforge_id }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-changelog: ${{ github.event.release.body }}

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.event.release.tag_name }}
          github-changelog: ''

      - name: Publish 26.1.2 NeoForge
        uses: Kira-NT/mc-publish@v3
        with:
          files: release/current-neoforge/scythe-mod-neoforge-${{ github.event.release.tag_name }}+26.1.2.jar
          name: ${{ github.event.release.tag_name }}+26.1.2
          version: ${{ github.event.release.tag_name }}+26.1.2
          version-type: release
          loaders: neoforge
          game-versions: 26.1.2
          game-version-filter: none
          environment: client | server

          modrinth-id: ${{ needs.metadata.outputs.modrinth_id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-changelog: ''

          curseforge-id: ${{ needs.metadata.outputs.curseforge_id }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-changelog: ${{ github.event.release.body }}

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.event.release.tag_name }}
          github-changelog: ''

      - name: Publish 26.2 NeoForge
        uses: Kira-NT/mc-publish@v3
        with:
          files: release/current-neoforge/scythe-mod-neoforge-${{ github.event.release.tag_name }}+26.2.jar
          name: ${{ github.event.release.tag_name }}+26.2
          version: ${{ github.event.release.tag_name }}+26.2
          version-type: release
          loaders: neoforge
          game-versions: 26.2
          game-version-filter: none
          environment: client | server

          modrinth-id: ${{ needs.metadata.outputs.modrinth_id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-changelog: ''

          curseforge-id: ${{ needs.metadata.outputs.curseforge_id }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-changelog: ${{ github.event.release.body }}

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.event.release.tag_name }}
          github-changelog: ''

      - name: Publish 26.3 NeoForge
        uses: Kira-NT/mc-publish@v3
        with:
          files: release/current-neoforge/scythe-mod-neoforge-${{ github.event.release.tag_name }}+26.3.jar
          name: ${{ github.event.release.tag_name }}+26.3
          version: ${{ github.event.release.tag_name }}+26.3
          version-type: release
          loaders: neoforge
          game-versions: 26.3
          game-version-filter: none
          environment: client | server

          modrinth-id: ${{ needs.metadata.outputs.modrinth_id }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-changelog: ''

          curseforge-id: ${{ needs.metadata.outputs.curseforge_id }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          curseforge-changelog: ${{ github.event.release.body }}

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.event.release.tag_name }}
          github-changelog: ''
