name: build
on: [pull_request, push]

jobs:
  checks:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: Resolve CI matrix from target properties
        id: matrix
        run: echo "matrix=$(python scripts/source_layout.py --ci-matrix)" >> "$GITHUB_OUTPUT"
      - name: Validate all source layers and generated IDEA launchers
        run: python scripts/validate_source_layout.py --report
      - name: Test source tools and resource generation
        run: python scripts/test_source_layout.py
      - name: Check Java syntax and isolated core contracts
        run: python scripts/verify_java.py

  build:
    needs: checks
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.checks.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'
      - name: Build and collect family
        working-directory: builds/${{ matrix.family }}
        run: sh ./gradlew --no-daemon buildAndCollect
      - name: Capture release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scythe-mod-${{ matrix.family }}
          path: build/release/*.jar
          if-no-files-found: error
