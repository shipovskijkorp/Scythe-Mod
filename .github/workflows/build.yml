name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: legacy
            java: '21'
          - family: modern
            java: '21'
          - family: current
            java: '25'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: 'microsoft'
      - name: Make Gradle wrapper executable
        run: chmod +x builds/${{ matrix.family }}/gradlew
      - name: Validate source layout
        run: python scripts/validate_source_layout.py
      - name: Build family
        working-directory: builds/${{ matrix.family }}
        run: ./gradlew build
      - name: Capture build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: scythe-mod-${{ matrix.family }}
          path: |
            builds/${{ matrix.family }}/build/libs/*.jar
            builds/${{ matrix.family }}/targets/*/build/libs/*.jar
